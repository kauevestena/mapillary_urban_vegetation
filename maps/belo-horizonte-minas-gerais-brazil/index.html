<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belo Horizonte · Urban vegetation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div id="map" role="region" aria-label="Map of vegetation seen in Mapillary images"></div>

  <section id="info" class="panel">
    <button class="toggle-info" type="button" aria-expanded="true">Hide</button>
    <div class="muted"><a href="../">← All cities</a></div>
    <h1 id="city-name"></h1>
    <div id="city-full-name" class="muted"></div>
    <div class="details">
      <div id="controls" class="controls-panel">
        <div class="control-row" id="metric-control-row">
          <label for="metric-select"><strong>Vegetation metric:</strong></label>
          <select id="metric-select" aria-label="Select metric">
            <option value="veg_median" selected>Median vegetation</option>
            <option value="veg_mean">Mean vegetation</option>
            <option value="veg_min">Minimum vegetation</option>
            <option value="veg_max">Maximum vegetation</option>
            <option value="veg_std">Standard deviation</option>
            <option value="veg_iqr">IQR (Q3 − Q1)</option>
            <option value="h_median">Median altitude</option>
            <option value="count">Photo count</option>
          </select>
        </div>
        <div class="control-row" id="layers-control-row">
          <span class="control-label"><strong>Layers:</strong></span>
          <div class="layer-checkboxes">
            <label id="lbl-segments"><input type="checkbox" id="layer-segments" checked> Streets</label>
            <label id="lbl-voronoi"><input type="checkbox" id="layer-voronoi"> Line Voronoi</label>
            <label id="lbl-points"><input type="checkbox" id="layer-points"> Photos</label>
          </div>
        </div>
        <details id="download-section" class="download-section">
          <summary><strong>Download</strong> <span class="muted">(GeoParquet)</span></summary>
          <div id="download-links" class="download-links"></div>
        </details>
      </div>
      <dl id="stats"></dl>
      <div id="legend" class="legend"></div>
      <p id="legend-note" class="muted">Streets are colored by the selected vegetation metric. Click any street or Voronoi cell for detailed statistics.</p>
    </div>
  </section>

  <div id="basemaps" class="panel" role="group" aria-label="Basemap"></div>

  <script type="application/json" id="config">{"slug": "belo-horizonte-minas-gerais-brazil", "name": "Belo Horizonte", "display_name": "Belo Horizonte, Minas Gerais, Região Sudeste, Brasil", "bounds": [-44.0632916, -20.0594646, -43.8572199, -19.7765437], "stats": {"images": 739103, "vegetation_median": 15.1, "vegetation_mean": 18.9, "date_min": "2021-02-26", "date_max": "2026-11-01", "tiles_completed": 93, "tiles_total": 93, "updated": "2026-11-10"}, "has_segments": true, "has_voronoi": true, "files": {"points": ["points.pmtiles"], "segments": ["segments.pmtiles"], "voronoi": ["voronoi.pmtiles"], "boundary": ["boundary.pmtiles"]}, "downloads": {"segments": ["segments.parquet"], "voronoi": ["voronoi.part000.parquet", "voronoi.part001.parquet", "voronoi.part002.parquet", "voronoi.part003.parquet"], "points": ["points.parquet"]}}</script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@3/dist/pmtiles.js"></script>
  <script src="../assets/map.js"></script>
  <script>initCityMap(JSON.parse(document.getElementById("config").textContent));</script>
</body>
</html>
