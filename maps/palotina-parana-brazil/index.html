<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palotina · Urban vegetation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">

</head>
<body>
  <div id="map" role="region" aria-label="Map of vegetation seen in Mapillary images"></div>

  <section id="info" class="panel">
    <button class="toggle-info" type="button" aria-expanded="true">Hide</button>
    <div class="muted"><a href="../">← All cities</a></div>
    <h1 id="city-name"></h1>
    <div id="city-full-name" class="muted"></div>
    <div class="details">
      <dl id="stats"></dl>
      <div id="legend" class="legend"></div>
      <p class="muted">Each dot is a Mapillary image with a full semantic segmentation; its color is the
        share of the image classified as vegetation. Click a dot to open the image.</p>
    </div>
  </section>

  <div id="basemaps" class="panel" role="group" aria-label="Basemap"></div>

  <script type="application/json" id="config">{"slug": "palotina-parana-brazil", "name": "Palotina", "display_name": "Palotina, Paraná, Região Sul, Brasil", "bounds": [-53.9665566, -24.4674687, -53.6615704, -24.1197867], "stats": {"images": 109068, "vegetation_median": 13.4, "vegetation_mean": 15.7, "date_min": "2021-10-26", "date_max": "2026-09-17", "tiles_completed": 51, "tiles_total": 172, "updated": "2026-09-29"}}</script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="../assets/map.js"></script>
  <script>initCityMap(JSON.parse(document.getElementById("config").textContent));</script>
</body>
</html>
