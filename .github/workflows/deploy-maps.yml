name: Deploy webmaps

on:
  # after each data fetch
  workflow_run:
    workflows: [Fetch city vegetation]
    types: [completed]

  # when the map code or templates change
  push:
    branches: [ main ]
    paths:
      - scripts/build_webmaps.py
      - scripts/webmap/**
      - maps/**
      - .github/workflows/deploy-maps.yml

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer one replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # skip failed or cancelled fetches
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main  # includes the data committed by the fetch run

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install geopandas pyarrow

    - name: Build webmaps
      run: python scripts/build_webmaps.py

    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload site
      uses: actions/upload-pages-artifact@v3
      with:
        path: maps

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
